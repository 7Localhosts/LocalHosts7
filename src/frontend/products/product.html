<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="../site-assets/Kay%E2%80%99s%20Haven%20Lavender%20Emblem.png">

    <title>Product Details - Kay's Haven</title>
  <meta name="api-base" content="">

    <link rel="stylesheet" href="../brand-system.css">
    <link rel="stylesheet" href="product.css">
</head>

<body>

    <main class="product-page" aria-busy="true">

        <!-- BACK TO SHOP -->

        <a class="kh-brand product-brand" href="../shop.html" aria-label="Kay's Haven shop"><span class="kh-brand__kays">Kay's</span><span class="kh-brand__haven">Haven</span></a>
        <a href="../shop.html" class="back-link">
            ← Back to shop
        </a>

        <div id="product-loading" class="product-loading" role="status" aria-live="polite">
            <span class="product-loading-spinner" aria-hidden="true"></span>
            <p>Loading product…</p>
        </div>

        <!-- PRODUCT DETAILS -->

        <section class="product-details" hidden>

            <!-- PRODUCT IMAGE -->

            <div class="product-image">

                <img
                    id="product-image"
                    src=""
                    alt="Product image"
                >

            </div>

            <!-- PRODUCT INFORMATION -->

            <div class="product-info">

                <p class="product-category kh-brand"><span class="kh-brand__kays">Kay's</span><span class="kh-brand__haven">Haven</span></p>

                <h1 id="product-name">
                    Product Name
                </h1>

                <p id="product-price">
                    GH₵0.00
                </p>

                <p id="product-description">
                    Product description goes here.
                </p>

                <!-- SIZE -->

                <div class="product-purchase-controls">

                <div class="product-variant">

                    <label for="product-size">
                        Size
                    </label>

                    <select id="product-size" aria-label="Choose a product size">
                        <option value="">None / N/A</option>
                    </select>

                </div>

                <!-- QUANTITY -->

                <div class="quantity">

                        <label for="quantity">
                        Quantity
                    </label>

                    <div class="quantity-control">

                        <button
                            type="button"
                            id="decrease-quantity"
                            aria-label="Decrease quantity"
                        >
                            −
                        </button>

                        <input
                            type="number"
                            id="quantity"
                            value="1"
                            min="1"
                            aria-label="Quantity"
                        >

                        <button
                            type="button"
                            id="increase-quantity"
                            aria-label="Increase quantity"
                        >
                            +
                        </button>

                    </div>

                </div>

                </div>

                <!-- ADD TO CART -->

                <button
                    type="button"
                    id="add-to-cart"
                >
                    Add to Cart
                </button>

            </div>

        </section>

    </main>

    <!-- JAVASCRIPT -->

    <script src="../product-images.js?v=5"></script>
    <script src="../api-config.js"></script>
    <script src="product.js"></script>

</body>

</html>
