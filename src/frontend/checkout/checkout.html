<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Complete your order at Kay's Haven Mothercare — quality UK &amp; USA baby, maternity, kids clothing and toys. Review your cart and proceed to payment.">
    <title>Checkout | Kay's Haven Mothercare</title>
    <link rel="stylesheet" href="checkout.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="wizard-container">
        <div class="wizard-header">
            <h2>Checkout</h2>
            <div class="stepper">
                <div class="step active" id="step1-indicator">1. Cart</div>
                <div class="step" id="step2-indicator">2. Details</div>
            </div>
        </div>

        <!-- Step 1: Cart -->
        <div class="wizard-step active-step" id="step-1">
            <div class="cart-items" id="cart-items">
                <!-- JS populated -->
            </div>
            <div class="cart-summary">
                <div class="summary-row">
                    <span>Subtotal</span>
                    <span id="subtotal">GH₵ 0.00</span>
                </div>
                <div class="summary-row">
                    <span>Delivery Fee</span>
                    <span id="delivery-fee">GH₵ 15.00</span>
                </div>
                <div class="summary-row total">
                    <span>Total</span>
                    <span id="total">GH₵ 15.00</span>
                </div>
            </div>
            <div class="wizard-actions">
                <button type="button" class="btn-primary" id="btn-next">Next: Details</button>
            </div>
        </div>

        <!-- Step 2: Details -->
        <div class="wizard-step" id="step-2">
            <form id="checkout-form">
                <div class="form-group">
                    <label for="fullName">Full Name</label>
                    <input type="text" id="fullName" placeholder="e.g. Kwame Mensah" required>
                </div>
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="e.g. kwame@example.com" required>
                </div>
                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" placeholder="e.g. 0244 000 000" required>
                </div>
                <div class="form-group">
                    <label for="address">Delivery Address</label>
                    <textarea id="address" placeholder="Enter your full delivery address" rows="3" required></textarea>
                </div>
                <div class="wizard-actions split">
                    <button type="button" class="btn-secondary" id="btn-back">Back</button>
                    <button type="submit" class="btn-primary">Proceed to Payment</button>
                </div>
            </form>
        </div>
    </div>

    <footer class="brand-footer">
        <p class="brand-name">Kay's Haven Mothercare</p>
        <p class="brand-tagline">Quality UK &amp; USA Products — Baby · Maternity · Kids · Toys</p>
        <div class="brand-contact">
