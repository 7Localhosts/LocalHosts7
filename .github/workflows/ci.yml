name: CI

on:
  push:
    branches: [ main, 6-payments-contact-reviews ]
  pull_request:
    branches: [ main ]

jobs:
  # ─── Job 1: Structure check ──────────────────────────────────────────────────
  structure:
    name: Repository structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required files and directories
        run: |
          test -f README.md
          test -d docs
          test -d src
          test -d tests
          test -d deployment
          test -f src/backend/server.js
          test -f src/backend/package.json
          test -f tests/test_api.js

  # ─── Job 2: API smoke tests ──────────────────────────────────────────────────
  api-tests:
    name: API smoke tests (43 assertions)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: src/backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Start backend server
        run: node server.js &
        env:
          PORT: 3000
          # No MONGODB_URI → runs with in-memory stores (correct for CI)
          # No PAYSTACK_SECRET_KEY → payment init returns 502 (tested as expected)

      - name: Wait for server to be ready
        run: |
          for i in {1..15}; do
            if curl -sf http://localhost:3000/api/health; then
              echo "Server is up!"
              break
            fi
            echo "Waiting... ($i/15)"
            sleep 1
          done

      - name: Run smoke tests
        working-directory: .
        run: node tests/test_api.js
